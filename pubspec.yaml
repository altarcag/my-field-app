name: my_field_atlas_android
description: "An offline-first field mapping and GPS application."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.3.0
  flutter_map: ^8.3.2
  flutter_map_mbtiles: ^1.0.4
  geolocator: ^14.0.3
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
